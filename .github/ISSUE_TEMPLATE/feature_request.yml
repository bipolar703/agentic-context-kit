name: Feature request
description: Propose an improvement to rules, runtime, scripts, or docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Security and token impact
      description: Does this add network access, mounts, privileges, or always-loaded rule text?
    validations:
      required: true
